{% load static %}
<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{% static 'ma_app/style.css' %}">
    <title>Admin simple</title>
</head>

<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a class="nav-btn" href="{% url 'create_role' %}">Rôles</a>
            <a class="nav-btn" href="{% url 'create_operation' %}">Opérations</a>
            <a class="nav-btn" href="{% url 'create_user' %}">Utilisateurs</a>
        </div>
    </nav>

    <main class="container">
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="message {{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>

</html>
